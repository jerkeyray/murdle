name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: wordle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d wordle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/wordle_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          version: 10.30.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: web
      - run: test -n "$TEST_DATABASE_URL"
      - run: make test
      - run: go test -race ./...
        working-directory: server
      - run: pnpm build
        working-directory: web
      - run: pnpm exec playwright test --workers=1
        working-directory: web
      - run: DUO_BROWSER_TEST=1 go test ./internal/http -run '^TestDuoBrowser$' -v
        working-directory: server
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: web/test-results/
          if-no-files-found: ignore
